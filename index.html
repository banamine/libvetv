<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1329" />
    <title>LIBVETV Studio — Daily Playlist</title>
    <meta name="description" content="LIBVETV Studio: today's published daily playlist with a rundown, media, monitor and telemetry docks." />
    <link rel="stylesheet" href="assets/daily-playlist.css" />
    <link rel="stylesheet" href="assets/studio.css" />
</head>
<body class="studio">
    <a class="st-skip" href="#dp-panel">Skip to player</a>

    <header class="st-top">
        <h1 class="st-brand"><span class="st-brand-mark" aria-hidden="true"></span>LIBVETV <span class="st-brand-sub">Studio</span></h1>
        <nav class="st-top-actions" aria-label="Page options">
            <button id="st-focus" class="dp-button st-focus" type="button" aria-pressed="false" title="Hide the side docks (F)">Focus mode</button>
            <a class="st-classic" href="legacy.html">Classic 24h schedule</a>
        </nav>
    </header>

    <main class="st-main">
        <div id="dp-root" class="dp-replacement-root" data-dp-mode="studio">
            <div class="dp-launch">
                <p class="st-empty-title">Today’s Daily Playlist</p>
                <p class="st-empty-copy">Today’s published rundown loads here. Nothing plays until you press Start.</p>
                <button id="dp-open" class="dp-button" type="button" aria-expanded="false" aria-controls="dp-panel">Daily Playlist</button>
                <button id="dp-show-legacy" class="dp-link" type="button" hidden>Show legacy 24h schedule</button>
                <p id="dp-check-status" class="dp-check-status" role="status" aria-live="polite">Checking daily playlist…</p>
            </div>
            <section id="dp-panel" class="dp-panel" hidden aria-labelledby="dp-title">
                <div class="dp-header">
                    <h2 id="dp-title">Daily Playlist</h2>
                    <button id="dp-close" class="dp-button" type="button">Close</button>
                </div>
                <div id="dp-status" class="dp-status" role="status" aria-live="polite"></div>
                <div id="dp-content"></div>
                <p class="dp-footer">Items are Internet Archive files listed by AJN. This page does not verify availability or usage rights.</p>
            </section>
        </div>
    </main>

    <nav class="st-tabs" aria-label="Studio panels">
        <button class="st-tab" type="button" data-sheet="rundown" aria-pressed="false">Rundown</button>
        <button class="st-tab" type="button" data-sheet="media" aria-pressed="false">Media</button>
        <button class="st-tab" type="button" data-sheet="monitor" aria-pressed="false">Monitor</button>
        <button class="st-tab" type="button" data-sheet="telemetry" aria-pressed="false">Telemetry</button>
    </nav>

    <script type="module" src="assets/daily-playlist.js"></script>
    <script type="module" src="assets/studio.js"></script>
</body>
</html>
