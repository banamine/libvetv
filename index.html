<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberty Express - Classic TV, News, Radio</title>
    <link rel="stylesheet" href="assets/liberty-skin.css">
</head>
<body>
    <header>
        <h1 class="brand-title">Liberty Express</h1>
        <div class="brand-tagline">Classic TV - News - Radio</div>
        <div class="marquee-strip" aria-hidden="true"><div class="marquee-dots"></div></div>
    </header>

    <main class="container">
        <section class="panel" aria-labelledby="now-playing-h">
            <div class="panel-header"><h2 id="now-playing-h" style="font:inherit;letter-spacing:inherit">Now Playing</h2></div>
            <div class="player-wrapper">
                <div id="player-container" class="player-content">
                    <div class="player-placeholder">Choose a show from the News Wall. Nothing plays until you click.</div>
                </div>
            </div>
            <div class="status-bar-container">
                <div class="status-progress-track"><div id="status-bar-progress" class="status-progress-bar"></div></div>
                <div id="status-bar-text" class="status-text-bar" aria-live="polite">
                    <span>Standby</span><span>Ready</span>
                </div>
            </div>
            <div class="panel-header" style="margin-top:0.5rem"><h2 style="font:inherit;letter-spacing:inherit">News Wall</h2></div>
            <div id="news-wall" class="news-grid"></div>
        </section>

        <section class="panel" id="guide" aria-labelledby="guide-h">
            <div class="panel-header"><h2 id="guide-h" style="font:inherit;letter-spacing:inherit">Channel Guide</h2></div>
            <div id="cat-bar" class="cat-bar" role="group" aria-label="Guide categories"></div>
            <input id="guide-search" class="guide-search" type="search" placeholder="Search pages..." aria-label="Search pages">
            <ul id="channel-guide-list" class="channel-ul"></ul>
        </section>
    </main>

    <footer>
        <nav class="footer-nav" aria-label="Footer">
            <a href="#guide">Guide</a>
            <a href="classic.html">Classic view</a>
            <a href="https://banamine.github.io/Control-Nav-Page/" rel="noopener">Control Center</a>
        </nav>
    </footer>

    <script type="module" src="assets/liberty-skin.js"></script>
</body>
</html>
