
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Librv Player – Reusable Playlist TV Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --gold-color: #f59e0b;
            --dark-card: #282828;
            --text-light: #f3f4f6;
            --blue-accent: #2563eb;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }
        .player-wrapper {
            width: 100%;
            max-width: 1600px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            transition: grid-template-columns 0.4s ease-in-out;
        }
        #tv-player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 4px solid var(--dark-card);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        #video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px);
            pointer-events: none;
            padding: 20px;
        }
        .info-bubble {
            background-color: rgba(40, 40, 40, 0.8);
            border: 1px solid var(--blue-accent);
            color: var(--blue-accent);
            padding: 6px 12px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
        }
        #channel-id {
            background-color: var(--blue-accent) !important;
            color: white !important;
        }
        .schedule-grid {
            background-color: var(--dark-card);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            max-height: 80vh;
            overflow-y: auto;
            padding: 10px;
        }
        .schedule-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: background-color 0.2s;
            border-left: 3px solid transparent;
            cursor: pointer;
        }
        .schedule-item:hover {
            background-color: rgba(37, 99, 235, 0.1);
        }
        .schedule-item.active {
            background-color: rgba(37, 99, 235, 0.2);
            border-left: 3px solid var(--blue-accent);
            font-weight: bold;
        }
        .time-label {
            min-width: 80px;
            font-size: 12px;
            color: #ccc;
            margin-right: 10px;
            font-family: monospace;
        }
        .title-label {
            font-size: 14px;
            flex-grow: 1;
        }
        #now-playing-banner {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            width: fit-content;
            margin-top: 10px;
            border-left: 4px solid var(--blue-accent);
        }
        #current-show {
            color: var(--blue-accent);
            font-weight: 700;
        }
        @media (min-width: 1024px) {
            .player-wrapper {
                grid-template-columns: 1fr 0;
                gap: 0;
            }
            .schedule-grid {
                opacity: 0;
                pointer-events: none;
                overflow: hidden;
                padding: 0;
                margin: 0;
                min-width: 0;
                transition: opacity 0.4s ease-in-out, padding 0.4s ease-in-out;
            }
            .player-wrapper:hover {
                grid-template-columns: 3fr 1fr;
                gap: 20px;
            }
            .player-wrapper:hover .schedule-grid {
                opacity: 1;
                pointer-events: auto;
                padding: 10px;
                margin-left: 0;
            }
        }
        #fullscreen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, transparent 100%);
            padding: 25px 40px;
            z-index: 2000;
            display: none;
            pointer-events: none;
        }
        #tv-player-container:fullscreen #fullscreen-overlay {
            display: block;
        }
        #fullscreen-title {
            font-size: 36px;
            font-weight: 800;
            color: #2563eb;
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
            margin-bottom: 15px;
        }
        #fullscreen-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            font-size: 20px;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,1);
        }
        #fullscreen-now {
            flex: 2;
            font-weight: 700;
            font-size: 24px;
        }
        #fullscreen-clock {
            font-family: monospace;
            font-size: 28px;
            color: #f59e0b;
            background-color: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 8px;
            letter-spacing: 2px;
        }
        #fullscreen-next {
            background-color: rgba(245, 158, 11, 0.25);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #f59e0b;
            font-size: 18px;
            font-weight: 600;
            flex: 2;
        }
        .librv-note {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        .mobile-schedule-toggle {
            display: none;
            background-color: var(--blue-accent);
            color: white;
            border: none;
            border-radius: 9999px;
            padding: 8px 16px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
        }
        @media (max-width: 1023px) {
            .mobile-schedule-toggle {
                display: block;
            }
            .schedule-grid.mobile-visible {
                display: block !important;
            }
            .schedule-grid:not(.mobile-visible) {
                display: none;
            }
        }
    </style>
</head>

<div class="player-wrapper">
    <div class="space-y-4">
        <h1 class="text-2xl font-extrabold text-blue-accent mb-3">
            📺 Librv Player 
        </h1>
        <div id="tv-player-container">
            <video id="video-player" autoplay muted playsinline controls preload="auto"></video>
            <div id="fullscreen-overlay">
                <div id="fullscreen-title">Now Playing</div>
                <div id="fullscreen-info">
                    <div id="fullscreen-now">Loading...</div>
                    <div id="fullscreen-clock">00:00:00 AM</div>
                    <div id="fullscreen-next">Next: Loading...</div>
                </div>
            </div>
            <div class="player-overlay flex justify-between">
                <div class="self-start space-y-2 pointer-events-none">
                    <div class="flex items-center space-x-2 pointer-events-auto">
                        <div id="channel-id" class="info-bubble text-white text-lg">LIBRV</div>
                        <div id="channel-name" class="info-bubble text-sm">scheduled</div>
                    </div>
                    <div id="now-playing-banner">
                        Now Playing: <span id="current-show">Loading menu...</span>
                    </div>
                </div>
                <div class="self-start text-right space-y-2 pointer-events-none">
                    <div id="player-clock" class="info-bubble text-lg !px-4">--:--:--</div>
                    <div id="stream-status" class="info-bubble bg-green-900/50 text-green-400 border-green-400">STATUS: READY</div>
                </div>
            </div>
        </div>
        <div class="flex flex-col sm:flex-row justify-between items-center bg-dark-card p-4 rounded-xl shadow-inner shadow-black/50">
            <div class="flex items-center space-x-3 mb-3 sm:mb-0 w-full sm:w-auto">
                <span class="text-lg font-semibold text-white">Volume:</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" class="w-24 h-2 bg-gray-700 rounded-lg">
                <span id="volume-display" class="text-blue-accent font-mono">50%</span>
            </div>
            <div class="flex space-x-3">
                <button id="stop-btn" class="info-bubble !bg-red-700 !text-white !border-red-700 hover:!bg-red-600" onclick="stopPlayback()">Stop</button>
                <button id="refresh-btn" class="info-bubble !bg-gray-700 !text-white !border-gray-700 hover:!bg-gray-600" onclick="location.reload()">Re‑Sync</button>
                <button id="fullscreen-btn" class="info-bubble !bg-blue-accent !text-white !border-blue-accent hover:brightness-110" onclick="toggleFullscreen()">⛶ Fullscreen</button>
                <button id="mobile-schedule-btn" class="mobile-schedule-toggle info-bubble !bg-blue-accent !text-white" onclick="toggleMobileSchedule()">📋 Schedule</button>
            </div>
        </div>
        <div class="librv-note">
            💡 Hover the video area (desktop) to see the full 24‑hour schedule sidebar. Click any item to jump.
        </div>
    </div>
    <div class="schedule-grid" id="schedule-grid">
        <h3 class="text-xl font-bold text-blue-accent mb-3 border-b border-gray-700 pb-2">24‑Hour Schedule</h3>
        <div id="schedule-list"><div class="text-gray-500 text-sm p-4">Generating schedule...</div></div>
    </div>
</div>

    // -------------------------------------------------------------------------
    // Generate 24-hour schedule using integer seconds (no floating drift)
    // -------------------------------------------------------------------------
    function generate24hrSchedule() {
        let schedule = [];
        let currentSeconds = 0;
        const startOfDay = new Date();
        startOfDay.setHours(0, 0, 0, 0);
        const MAX_SECONDS = 24 * 3600;
        let index = 0;

        while (currentSeconds < MAX_SECONDS && index < playlist.length * 10) {
            const item = playlist[index % playlist.length];
            if (!item) break;

            const durationSec = item.duration || 1800; // fallback to 30 min
            const startSeconds = currentSeconds;
            const endSeconds = currentSeconds + durationSec;

            const startDate = new Date(startOfDay.getTime() + startSeconds * 1000);
            const startFormatted = startDate.toLocaleTimeString('en-US', {
                hour: 'numeric', minute: '2-digit', hour12: true
            });

            schedule.push({
                title: item.title,
                startTime: startFormatted,
                startSeconds: startSeconds,
                endSeconds: endSeconds,
                file: item.file,
                playlistIndex: index % playlist.length   // absolute index in playlist
            });

            currentSeconds = endSeconds;
            index++;
        }
        return schedule;
    }

    let fullSchedule = generate24hrSchedule();
    let currentScheduleIndex = -1;       // index in fullSchedule, not playlist
    let hls = null;
    const videoPlayer = document.getElementById('video-player');

    // -------------------------------------------------------------------------
    // loadStream – uses playlistIndex from schedule item
    // -------------------------------------------------------------------------
    function loadStream(url, playlistIdx, scheduleIdx = null) {
        if (hls) { hls.destroy(); hls = null; }
        videoPlayer.pause();
        videoPlayer.removeAttribute('src');

        // Debug log – verify mapping
        const expectedTitle = playlist[playlistIdx]?.title || 'UNKNOWN';
        console.log(`[loadStream] Playing index ${playlistIdx} -> "${expectedTitle}" (URL: ${url})`);

        if (url.toLowerCase().includes('.m3u8')) {
            if (Hls.isSupported()) {
                hls = new Hls({ maxMaxBufferLength: 30 });
                hls.loadSource(url);
                hls.attachMedia(videoPlayer);
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = url;
            }
        } else {
            videoPlayer.src = url;
        }

        videoPlayer.play().catch(e => console.warn("Autoplay prevented:", e));

        // Store current schedule index for later auto-advance
        if (scheduleIdx !== null) {
            currentScheduleIndex = scheduleIdx;
        } else {
            // Try to find which schedule item has this playlistIndex (fallback)
            const found = fullSchedule.findIndex(item => item.playlistIndex === playlistIdx);
            currentScheduleIndex = found !== -1 ? found : currentScheduleIndex;
        }

        updateNowPlaying(true);
        document.getElementById('stream-status').textContent = 'STATUS: PLAYING';
        document.getElementById('stream-status').className = 'info-bubble bg-green-900/50 text-green-400 border-green-400';
    }

    // -------------------------------------------------------------------------
    // Auto-advance using schedule, not raw playlist order
    // -------------------------------------------------------------------------
    videoPlayer.onended = () => {
        if (fullSchedule.length === 0) return;
        // Find the next schedule entry after the current one
        let nextScheduleIdx = (currentScheduleIndex + 1) % fullSchedule.length;
        const nextItem = fullSchedule[nextScheduleIdx];
        if (nextItem) {
            console.log(`[onended] Advancing to schedule index ${nextScheduleIdx} (playlist index ${nextItem.playlistIndex})`);
            loadStream(nextItem.file, nextItem.playlistIndex, nextScheduleIdx);
        } else {
            console.warn("[onended] No next schedule item found, reloading first");
            loadStream(fullSchedule[0].file, fullSchedule[0].playlistIndex, 0);
        }
    };

    videoPlayer.onerror = (e) => {
        console.error("Video error:", videoPlayer.error);
        document.getElementById('stream-status').textContent = 'STATUS: ERROR';
        document.getElementById('stream-status').className = 'info-bubble bg-red-900/50 text-red-400 border-red-400';
    };

    // -------------------------------------------------------------------------
    // updateNowPlaying – uses schedule index for highlighting
    // -------------------------------------------------------------------------
    function updateNowPlaying(force = false) {
        const now = new Date();
        const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        let activeIdx = -1;
        for (let i = 0; i < fullSchedule.length; i++) {
            const s = fullSchedule[i];
            if (currentSeconds >= s.startSeconds && currentSeconds < s.endSeconds) {
                activeIdx = i;
                break;
            }
        }
        if (activeIdx === -1 && fullSchedule.length > 0) activeIdx = 0; // default to first

        if (activeIdx !== -1) {
            // Update UI highlight
            document.querySelectorAll('.schedule-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`schedule-item-${activeIdx}`);
            if (activeEl) activeEl.classList.add('active');

            const currentShow = fullSchedule[activeIdx].title;
            document.getElementById('current-show').textContent = currentShow;
            document.getElementById('fullscreen-now').textContent = currentShow;

            const nextIdx = (activeIdx + 1) % fullSchedule.length;
            const nextShow = fullSchedule[nextIdx];
            const nextContainer = document.getElementById('fullscreen-next');
            nextContainer.textContent = '';
            const prefix = document.createTextNode('Next: ');
            const titleSpan = document.createElement('span');
            titleSpan.textContent = nextShow.title;
            const suffix = document.createTextNode(` @ ${nextShow.startTime}`);
            nextContainer.appendChild(prefix);
            nextContainer.appendChild(titleSpan);
            nextContainer.appendChild(suffix);

            // Auto-scroll only when schedule index changes
            if (force || activeIdx !== currentScheduleIndex) {
                const el = document.getElementById(`schedule-item-${activeIdx}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                currentScheduleIndex = activeIdx;
            }
        }

        // Update clocks
        const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('player-clock').textContent = timeStr;
        const fsClock = document.getElementById('fullscreen-clock');
        if (fsClock) fsClock.textContent = timeStr;
    }

    // -------------------------------------------------------------------------
    // Render schedule – onclick passes both file and playlistIndex + schedule index
    // -------------------------------------------------------------------------
    function renderScheduleUI() {
        const container = document.getElementById('schedule-list');
        container.innerHTML = '';
        fullSchedule.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'schedule-item';
            div.id = `schedule-item-${idx}`;
            div.onclick = () => {
                console.log(`[click] Schedule index ${idx} -> playlist index ${item.playlistIndex} (${item.title})`);
                loadStream(item.file, item.playlistIndex, idx);
            };
            const span1 = document.createElement('span');
            span1.className = 'time-label';
            span1.textContent = item.startTime;
            const span2 = document.createElement('span');
            span2.className = 'title-label';
            span2.textContent = item.title;
            div.appendChild(span1);
            div.appendChild(span2);
            container.appendChild(div);
        });
    }

    // -------------------------------------------------------------------------
    // Volume & UI utilities
    // -------------------------------------------------------------------------
    const volumeSlider = document.getElementById('volume-slider');
    const volumeDisplay = document.getElementById('volume-display');
    function updateVolume() {
        videoPlayer.volume = volumeSlider.value;
        const percent = Math.round(volumeSlider.value * 100);
        volumeDisplay.textContent = percent + "%";
        videoPlayer.muted = (volumeSlider.value == 0);
    }
    volumeSlider.addEventListener('input', updateVolume);
    videoPlayer.volume = 0.5;
    updateVolume();

    window.stopPlayback = function() {
        videoPlayer.pause();
        if (hls) { hls.destroy(); hls = null; }
        videoPlayer.src = '';
        document.getElementById('stream-status').textContent = 'STATUS: STOPPED';
        document.getElementById('stream-status').className = 'info-bubble bg-red-900/50 text-red-400 border-red-400';
    };
    window.toggleFullscreen = function() {
        const container = document.getElementById('tv-player-container');
        if (!document.fullscreenElement) { container.requestFullscreen().catch(err => console.error(err)); }
        else { document.exitFullscreen(); }
    };
    window.toggleMobileSchedule = function() {
        const grid = document.getElementById('schedule-grid');
        grid.classList.toggle('mobile-visible');
    };

    function init() {
        if (!playlist.length) {
            document.getElementById('schedule-list').innerHTML = '<div class="text-red-400 p-4">ERROR: No playlist data.</div>';
            return;
        }
        renderScheduleUI();
        // Start with the first schedule item (which corresponds to the first playlist item)
        const firstSchedule = fullSchedule[0];
        if (firstSchedule) {
            loadStream(firstSchedule.file, firstSchedule.playlistIndex, 0);
        }
        setInterval(updateNowPlaying, 5000);
        updateNowPlaying();
    }
    init();
</script>
</body>
</html>
