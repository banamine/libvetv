<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anabia's Films Player</title>
<style>
:root{--bg:#0b1630;--panel:#12224a;--card:#162a5c;--gold:#e8b931;--gold2:#ffd866;--text:#eef2ff;--muted:#9fb0d8;--line:#24407e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:2px solid var(--gold);background:linear-gradient(#142a5e,#0b1630)}
h1{margin:0;font-size:20px;color:var(--gold2);letter-spacing:.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
button{cursor:pointer;border-color:var(--gold);color:var(--gold2)}
button:hover{background:var(--gold);color:#0b1630}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px 20px;max-width:1500px;margin:auto}
.stage{position:sticky;top:12px;align-self:start}
.player{position:relative;aspect-ratio:16/9;background:#000;border:2px solid var(--gold);border-radius:8px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .idle{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.now{margin:10px 2px 0;font-size:17px;color:var(--gold2)}
.meta{color:var(--muted);font-size:13px;margin:2px}
.nav{display:flex;gap:8px;margin-top:10px}
.list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
.card{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;text-align:left;color:var(--text)}
.card:hover{border-color:var(--gold)}
.card.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#1d3570}
.card img{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;flex:none;background:#000}
.card b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.card small{color:var(--muted)}
.status{color:var(--muted);font-size:13px}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px 16px}.stage{position:static}.list{max-height:none}}
</style>
</head>
<body>
<header>
  <h1>★ Anabia's Films — Movie Player</h1>
  <div class="tools">
    <input id="q" type="search" placeholder="Search titles…">
    <select id="sort"><option value="new">Newest</option><option value="old">Oldest</option><option value="az">A–Z</option><option value="long">Longest</option></select>
    <button id="refresh" title="Re-parse the channel live from the Dailymotion API">↻ Refresh</button>
  </div>
</header>
<main>
  <section class="stage">
    <div class="player" id="player"><div class="idle">Pick a movie to start</div></div>
    <div class="now" id="now"></div>
    <div class="meta" id="meta"></div>
    <div class="nav"><button id="prev">◀ Prev</button><button id="next">Next ▶</button><span class="status" id="status"></span></div>
  </section>
  <aside class="list" id="list"></aside>
</main>
<script>
const USER = 'AnabiasFilmsLtd';
// Snapshot parsed 2026-10-24: [id, full title, duration sec, created unix]
let MOVIES = [
["xa5bhh0","Whispers Behind the Door (2026) | Full Psychological Thriller Movie | Lifetime Drama",4787,1775991629],
["xa5bia6","The Past She Should Have Feared (2026) | Full Thriller Movie | New Release",5253,1775986359],
["xa4z0v2","Falling for You Again (2026) | Hallmark Romance Movie | Full Movie",4665,1775750450],
["x9yzbgm","Denzel Washington (2026) | Newly Released Full Action Movie | Crime Thriller",5160,0],
["x9yppd0","Boarding House (2026) | Full Thriller Movie | A Simple Room Rental Becomes a Living Nightmare",5167,0],
["x9yplra","They Killed Her Mom, Now They’ll Pay (2026) | Full Action Crime Drama | Gift of Fear",6775,0],
["x9yjujo","You Picked The Wrong One (2026) | Full Thriller Movie | Suspense Drama",4352,0],
["x9yhmr8","A Murderous Affair: The Carolyn Warmus Story (2026) | Full Crime Drama Movie | Virginia Madsen, Chris Sarandon",5616,0],
["x9ydwf0","The Missing Twin Sister (2026) | Full Drama Thriller Movie | Based on a True Story",5085,0],
["x9y8r40","A Mother’s Nightmare (2026) | Full Thriller Drama Movie | Inspired by a True Story",5082,0],
["x9xy3gg","Stolen Child (Full Movie) | Thriller | Suspense Drama | English Movie 2026",5176,0],
["x9sybpy","Beware The Jersey Devil | Action Survival Movie | Halloween 2025",4485,0],
["x9stwu4","Whispers of Winter (2025) | New Hallmark Christmas Romance | Heartfelt Holiday Movie",5761,0],
["x9fokag","KING OF THE LOST WORLD - Hollywood Action Adventure English Movie",4575,0],
["x9fnro4","Triple Kill _ New Action Movie _ Latest Blockbuster Hollywood Movie in HD _ 4K Ultra",4173,0],
["x9ehpmw","Bruce Willis In THE HOLD BACK - Hollywood Hit Action Thriller English Movie - 50 Cent",5392,0],
["x9dj9s6","[New]  Assumed Killer 2025 #LMN _ BEST Lifetime Movies _ Based on a true story 2025",5006,0],
["x9dj9oi","The Lord of the Rings- The Fellowship of the Ring  - 1950's Super Panavision 70",112,0],
["x9cgf8q","A Novel Romance in 2025 - New Hallmark Movie",5437,0]
].map(([id,title,duration,created],i)=>({id,title,duration,created:created||(1775000000 - i*1000)})); // undated rows keep channel order

// ---- The "formula": clean a raw upload title into a display title ----
function cleanTitle(t){
  let s = t.replace(/_/g,'|').replace(/\s+-\s+/g,' | ').replace(/\[new\]|#\w+/gi,'');
  let head = s.split('|')[0].trim();                       // first segment = the movie name
  head = head.replace(/\((full movie)\)/i,'').replace(/\s{2,}/g,' ').trim();
  return head || t;
}
function year(t){const m=t.match(/\b(19|20)\d{2}\b/);return m?m[0]:'';}
function tags(t){return t.split(/[|_]| - /).slice(1).map(x=>x.trim()).filter(x=>x && !/full movie|new release|english movie/i.test(x)).slice(0,2).join(' · ');}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m`;};
const thumb=id=>`https://www.dailymotion.com/thumbnail/video/${encodeURIComponent(id)}`;
const embed=id=>`https://www.dailymotion.com/embed/video/${encodeURIComponent(id)}?autoplay=1&queue-enable=false&ui-start-screen-info=false`;

// ---- Live re-parse from the public Dailymotion API (paginated) ----
async function refresh(){
  status('Parsing channel…');
  try{
    let page=1,more=true,out=[];
    while(more && page<=20){
      const r=await fetch(`https://api.dailymotion.com/user/${USER}/videos?fields=id,title,duration,created_time&limit=100&page=${page}`).then(r=>r.json());
      out.push(...(r.list||[]).map(v=>({id:v.id,title:v.title,duration:v.duration,created:v.created_time})));
      more=r.has_more; page++;
    }
    if(out.length){MOVIES=out;render();status(`${out.length} movies loaded live`);}
  }catch(e){status('Live refresh failed — using saved list');}
}

let current=-1, view=[];
const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;

function render(){
  const q=$('q').value.toLowerCase(), sort=$('sort').value;
  view=MOVIES.filter(m=>m.title.toLowerCase().includes(q));
  const by={new:(a,b)=>b.created-a.created,old:(a,b)=>a.created-b.created,az:(a,b)=>cleanTitle(a.title).localeCompare(cleanTitle(b.title)),long:(a,b)=>b.duration-a.duration}[sort];
  view.sort(by);
  $('list').innerHTML=view.map((m,i)=>`
    <button class="card${m.id===activeId?' active':''}" data-i="${i}" title="${esc(m.title)}">
      <img loading="lazy" src="${thumb(m.id)}" alt="">
      <span><b>${esc(cleanTitle(m.title))}</b><small>${esc([year(m.title),fmt(m.duration)].filter(Boolean).join(' · '))}</small><br><small>${esc(tags(m.title))}</small></span>
    </button>`).join('');
  current=view.findIndex(m=>m.id===activeId);
}
let activeId=null;
function play(i){
  if(i<0||i>=view.length) return;
  const m=view[i]; current=i; activeId=m.id;
  $('player').innerHTML=`<iframe src="${embed(m.id)}" title="${esc(cleanTitle(m.title))}" allow="autoplay; fullscreen; picture-in-picture; web-share" allowfullscreen></iframe>`;
  $('now').textContent=cleanTitle(m.title);
  $('meta').textContent=[year(m.title),fmt(m.duration),tags(m.title)].filter(Boolean).join(' · ');
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',+c.dataset.i===i));
  if(location.hash!=='#'+m.id) history.replaceState(null,'','#'+m.id);
  if(innerWidth<900) $('player').scrollIntoView({behavior:'smooth'});
}
$('list').onclick=e=>{const c=e.target.closest('.card');if(c)play(+c.dataset.i);};
$('q').oninput=render; $('sort').onchange=render;
$('prev').onclick=()=>play(current-1); $('next').onclick=()=>play(current+1);
$('refresh').onclick=refresh;
render();
const deep=location.hash.slice(1); if(deep){const i=view.findIndex(m=>m.id===deep); if(i>=0) play(i);}
status(`${MOVIES.length} movies`);
</script>
</body>
</html>
